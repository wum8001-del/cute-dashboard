<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff8fa3">
<link rel="manifest" href="/manifest.json">

<title>🌸 可爱工作台</title>
<style>
:root{--bg:#fef9f4;--card-bg:#fff;--primary:#ff8fa3;--primary-light:#ffd6e0;--accent:#ffb347;--accent-light:#ffe0b2;--blue:#87ceeb;--blue-light:#d6f0fb;--green:#90ee90;--green-light:#d4f5d4;--purple:#c3aed6;--purple-light:#e8dff5;--text:#4a4a4a;--text-light:#8a8a8a;--text-muted:#b0b0b0;--border:#f0e6e0;--shadow:0 2px 12px rgba(0,0,0,0.05);--radius:14px;--radius-sm:10px;--font:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;--sidebar-w:180px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh}
/* sidebar */
.sidebar{width:var(--sidebar-w);background:var(--card-bg);border-right:1px solid var(--border);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:fixed;top:0;left:0;bottom:0;z-index:200;overflow-y:auto}
.sidebar-logo{font-size:2rem;text-align:center;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:0.85rem;color:var(--text-light);transition:all 0.2s;border:none;background:transparent;font-family:var(--font);width:100%;text-align:left}
.nav-item:hover{background:var(--primary-light)}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.nav-icon{font-size:1.1rem;width:22px;text-align:center}
.points-badge{font-size:0.75rem;background:linear-gradient(135deg,#ffd700,#ffb347);padding:4px 10px;border-radius:14px;color:#8b6914;font-weight:700;text-align:center;margin-top:auto}
/* main */
.main-wrapper{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.greeting h1{font-size:1.2rem;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.date-time{font-size:0.75rem;color:var(--text-muted)}
.header-right{display:flex;align-items:center;gap:10px}
.sleep-badge{font-size:0.78rem;background:var(--purple-light);padding:4px 12px;border-radius:14px;color:#7c6ba0}
/* dashboard grid */
.dashboard{flex:1;padding:16px 20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-content:start}
.card{background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card.hidden-section{display:none}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-header h2{font-size:0.95rem}
.streak-badge{font-size:0.72rem;background:var(--accent-light);padding:2px 10px;border-radius:10px;color:#cc8a2a;font-weight:600}
.episode-tag{font-size:0.68rem;background:var(--accent-light);padding:2px 8px;border-radius:10px;color:#cc8a2a;margin-left:6px}
.source-tag{font-size:0.68rem;background:#fbe4f0;color:#d4687c;padding:2px 8px;border-radius:8px}
/* tabs */
.tab-row{display:flex;gap:4px;margin-bottom:10px}
.tab-btn{flex:1;padding:7px;border-radius:10px;border:1.5px solid var(--border);background:transparent;font-size:0.78rem;cursor:pointer;color:var(--text);font-family:var(--font)}
.tab-btn.active{background:var(--primary-light);border-color:var(--primary);color:#d4687c;font-weight:600}
.tab-content{display:none}
.tab-content.active{display:block}
/* buttons */
.btn{padding:8px 10px;border-radius:14px;border:none;font-size:0.75rem;font-weight:600;cursor:pointer;font-family:var(--font)}
.btn-play{background:var(--blue-light);color:#4a8ab5}
.btn-prev{background:#f0e6f6;color:#9b8cc0}
.btn-record{background:#ffe0e0;color:#d4687c}
.btn-next{background:var(--green-light);color:#5a9e5a}
.btn-record.recording{background:#ff4444;color:white;animation:pulse 1s infinite}
.btn-small{padding:4px 7px;font-size:0.68rem;border-radius:8px;border:none;cursor:pointer;background:#f0f0f0;color:var(--text-light);font-family:var(--font)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,68,68,0.4)}50%{box-shadow:0 0 0 8px rgba(255,68,68,0)}}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px 0}
.btn-timer{width:100%;padding:10px;font-size:0.85rem;border-radius:16px;border:none;cursor:pointer;font-weight:600;font-family:var(--font)}
.btn-start{background:var(--green);color:white}
.btn-start.running{background:#ff8fa3}
.btn-reset{background:#f0f0f0;color:var(--text-light)}
.btn-reset.hidden{display:none}
/* video */
.en-video-wrapper{position:relative;width:100%;padding-top:56.25%;background:#1a1a2e;border-radius:var(--radius-sm);overflow:hidden;margin:6px 0}
.en-video-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#e0d7ff;background:linear-gradient(135deg,#2d1b69,#1a1a2e);cursor:pointer}
.en-video-start-icon{font-size:1.6rem;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.en-video-placeholder p{font-size:0.8rem;margin:0}
.en-video-sub{font-size:0.68rem;opacity:0.7;margin:0}
.en-bilibili-frame{position:absolute;inset:0;width:100%;height:100%;border:none}
.en-bilibili-frame.hidden,.en-video-placeholder.hidden{display:none}
.video-click-shield{position:absolute;inset:0;z-index:10;pointer-events:none;display:none}
.video-click-shield.active{display:block}
.video-click-shield.paused{background:rgba(0,0,0,0.35);pointer-events:auto;cursor:pointer}
.video-click-shield .pause-icon{display:none;font-size:3rem;color:white;text-shadow:0 2px 8px rgba(0,0,0,0.5)}
.video-click-shield.paused .pause-icon{display:flex;align-items:center;justify-content:center;height:100%}
.video-click-hint{position:absolute;top:8px;right:8px;z-index:11;background:rgba(0,0,0,0.6);color:white;padding:3px 8px;border-radius:8px;font-size:0.65rem;pointer-events:none;display:none}
.video-click-hint.show{display:block}
/* timer */
.en-timer-row{display:flex;align-items:center;justify-content:center;gap:5px;padding:4px 0;flex-wrap:wrap;font-size:0.78rem}
.en-timer-countdown{font-weight:700;color:var(--purple);background:var(--purple-light);padding:2px 10px;border-radius:10px}
.en-timer-label{font-size:0.72rem;color:var(--text-light)}
.en-timer-sep{color:var(--text-light);font-size:0.75rem}
.en-timer-total{font-size:0.72rem;color:var(--text-light);opacity:0.7}
.en-time-warning{font-size:0.68rem;color:#e67e22;background:#fff3e0;padding:2px 6px;border-radius:6px}
.en-time-warning.hidden{display:none}
.en-timer-actions{display:flex;gap:3px;margin-left:auto}
.en-progress-bar{width:100%;height:2px;background:#e8e0f0;border-radius:1px;margin-bottom:8px;overflow:hidden}
.en-progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),#9b59b6);border-radius:1px;transition:width 0.5s}
.en-progress-fill.overtime{background:linear-gradient(90deg,#e67e22,#e74c3c);animation:pulse 1s infinite}
/* shadowing */
.en-shadow-section{background:linear-gradient(135deg,#fdf6ff,#fef9f0);border:1.5px dashed var(--purple-light);border-radius:var(--radius);padding:8px;margin-top:4px}
.en-shadow-title{font-size:0.8rem;font-weight:700;color:var(--purple);margin:0 0 6px 0;text-align:center}
.en-sentence-box{background:var(--blue-light);border-radius:var(--radius-sm);padding:10px;margin:6px 0;text-align:center}
.en-sentence-label{font-size:0.68rem;color:var(--text-light);margin-bottom:2px}
.en-sentence{font-size:0.9rem;color:#3a6b8c;font-weight:500}
.en-translation{font-size:0.75rem;color:#6b9bb8;margin-top:2px}
.score-bar{height:4px;background:#f0f0f0;border-radius:2px;overflow:hidden;margin:4px 0}
.score-fill{height:100%;background:linear-gradient(90deg,#ff8fa3,#ffb347,#90ee90);border-radius:2px;transition:width 0.5s}
.score-text{font-size:0.72rem;color:var(--text-light)}
/* word feedback */
.word-feedback{margin:6px 0;padding:8px;background:#fdf8f0;border-radius:var(--radius-sm);border:1px dashed var(--accent)}
.word-feedback.hidden{display:none}
.word-feedback h4{font-size:0.72rem;margin-bottom:4px;color:var(--accent)}
.word-list{display:flex;flex-wrap:wrap;gap:3px}
.word-item{display:flex;flex-direction:column;align-items:center;padding:3px 6px;border-radius:6px;font-size:0.7rem}
.word-item.good{background:#d4f5d4;color:#5a9e5a}
.word-item.bad{background:#ff4444;color:white;font-weight:700;box-shadow:0 0 5px rgba(255,68,68,0.4);animation:badPulse 0.8s infinite alternate;cursor:pointer}
/* 原句内单词标注 */
.word-inline{display:inline-block;padding:1px 3px;margin:1px;border-radius:3px;font-weight:600;transition:all 0.2s}
.word-inline.good{background:#d4f5d4;color:#2d7d2d}
.word-inline.bad{background:#ff4444;color:white;animation:badPulse 0.8s infinite alternate;cursor:pointer;text-decoration:underline;text-decoration-style:wavy;text-underline-offset:3px}
.word-inline.bad:hover{background:#cc0000;transform:scale(1.1)}
@keyframes badPulse{from{box-shadow:0 0 3px rgba(255,68,68,0.4)}to{box-shadow:0 0 8px rgba(255,68,68,0.7)}}
.en-auto-next{display:flex;align-items:center;justify-content:center;gap:4px;padding:4px;margin-top:4px;font-size:0.75rem;color:var(--text-light);background:#f0f0f8;border-radius:6px}
.en-auto-next.hidden{display:none}
.en-auto-countdown{font-weight:700;color:var(--purple);background:var(--purple-light);padding:1px 5px;border-radius:5px;min-width:20px;text-align:center}
/* exercise */
.exercise-video-title{font-size:0.85rem;font-weight:600}
.exercise-video-desc{font-size:0.72rem;color:var(--text-light);margin-bottom:6px}
.timer-display{text-align:center;padding:10px;background:linear-gradient(135deg,#f0fdf0,#e8f5e8);border-radius:var(--radius-sm);margin:6px 0}
.timer-big{font-size:1.6rem;font-weight:700;color:#5a9e5a}
.timer-ctrls{display:flex;flex-direction:column;gap:4px}
/* reading */
.reading-timer-row{display:flex;align-items:center;gap:6px;padding:6px;background:#fdf6f0;border-radius:var(--radius-sm);margin-bottom:6px;font-size:0.8rem}
.reading-time{font-weight:700;color:var(--accent);font-size:0.9rem}
.reading-notes textarea{width:100%;min-height:50px;border-radius:var(--radius-sm);border:1.5px solid var(--border);padding:8px;font-family:var(--font);font-size:0.8rem;resize:vertical}
.notes-list{max-height:100px;overflow-y:auto}
.note-entry{background:#faf8f5;padding:6px;border-radius:6px;margin-bottom:3px;font-size:0.72rem;border-left:3px solid var(--accent)}
.note-entry .note-date{font-size:0.65rem;color:var(--text-muted)}
.empty-hint{font-size:0.72rem;color:var(--text-muted);text-align:center;padding:8px}
/* expense */
.expense-total{text-align:center;padding:8px;margin-bottom:6px;background:linear-gradient(135deg,#fff5f5,#fff8f0);border-radius:var(--radius-sm)}
.total-label{font-size:0.72rem;color:var(--text-light)}
.total-amount{font-size:1.3rem;font-weight:700;color:var(--primary)}
.cat-item{display:grid;grid-template-columns:24px 50px 1fr;align-items:center;gap:1px 4px;padding:3px 0;font-size:0.75rem}
.cat-amount{font-weight:600;text-align:right}
.cat-bar{grid-column:2/4;height:3px;background:#f0f0f0;border-radius:1px;overflow:hidden}
.cat-fill{height:100%;border-radius:1px;transition:width 0.5s}
/* inspiration */
.post-list{max-height:200px;overflow-y:auto}
.post-item{display:flex;align-items:flex-start;gap:6px;padding:6px;border-radius:6px;margin-bottom:3px;background:#fafafa;cursor:pointer}
.post-item:active{background:#fff0f3}
.post-rank{font-size:0.9rem;flex-shrink:0;width:20px;text-align:center}
.post-title{font-size:0.75rem;font-weight:500}
.post-meta{font-size:0.65rem;color:var(--text-muted);margin-top:1px}
.data-source{font-size:0.6rem;background:#f0f0f0;padding:1px 4px;border-radius:4px;color:var(--text-muted);margin-left:4px}
/* money tips */
.money-tip{display:flex;align-items:flex-start;gap:6px;padding:8px;border-radius:6px;margin-bottom:4px;background:linear-gradient(135deg,#fffdf5,#fff8e8);border-left:3px solid var(--accent);font-size:0.78rem}
.money-tip-num{font-size:1rem;font-weight:700;color:var(--accent);flex-shrink:0;width:20px;text-align:center}
.money-tip-platform{font-size:0.6rem;background:var(--accent-light);padding:1px 4px;border-radius:4px;color:#cc8a2a;margin-left:4px}
/* invest */
.index-card{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;background:#fafafa;margin-bottom:3px;font-size:0.78rem}
.index-price{font-weight:700}
.index-change{font-size:0.72rem;font-weight:600;padding:1px 5px;border-radius:4px}
.index-change.up{color:#e74c3c;background:#ffe8e5}
.index-change.down{color:#27ae60;background:#e5f9e5}
.sector-list{display:flex;flex-wrap:wrap;gap:3px}
.sector-item{padding:2px 6px;border-radius:8px;font-size:0.65rem;cursor:pointer}
.sector-item:hover{opacity:0.8;transform:scale(1.05)}
.sector-item.up{background:#ffe8e5;color:#e74c3c}
.sector-item.down{background:#e5f9e5;color:#27ae60}
.sector-item.active{outline:2px solid var(--primary);outline-offset:1px}
/* sector stock popup */
.sector-stocks{margin-top:8px;padding:8px;background:#fafafa;border-radius:8px;display:none}
.sector-stocks.show{display:block}
.sector-stocks h4{font-size:0.78rem;margin-bottom:6px;color:var(--text)}
.stock-row{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-radius:4px;font-size:0.72rem;margin-bottom:2px}
.stock-row:nth-child(odd){background:#fff}
.stock-row .stock-name{flex:1;font-weight:500}
.stock-row .stock-price{font-weight:600;margin:0 8px}
.stock-row .stock-change{font-weight:600;font-size:0.68rem;padding:1px 5px;border-radius:3px}
.stock-row .stock-change.up{color:#e74c3c;background:#ffe8e5}
.stock-row .stock-change.down{color:#27ae60;background:#e5f9e5}
.stock-loading{text-align:center;font-size:0.72rem;color:var(--text-muted);padding:10px}
/* gold */
.gold-item{display:flex;align-items:center;gap:4px;padding:6px;background:linear-gradient(135deg,#fffdf5,#fff8e8);border-radius:6px;margin-bottom:4px;font-size:0.78rem}
.gold-item.main{background:linear-gradient(135deg,#fff8e1,#ffecb3);border:1px solid #ffd54f}
.gold-label{flex:1}
.gold-value{font-weight:700;color:#b8860b}
.gold-item.main .gold-value{font-size:0.9rem;color:#e65100}
.gold-unit{font-size:0.65rem;color:var(--text-muted)}
/* sleep */
.sleep-content{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sleep-moon{font-size:1.6rem;animation:float 3s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.sleep-bar{height:4px;background:#f0f0f0;border-radius:2px;overflow:hidden;margin-top:3px}
.sleep-fill{height:100%;background:linear-gradient(90deg,#c3aed6,#7c6ba0);border-radius:2px}
.sleep-tips{background:var(--purple-light);padding:6px;border-radius:6px;font-size:0.72rem;color:#7c6ba0}
/* reward */
.reward-overlay{position:fixed;inset:0;z-index:9999;pointer-events:none;display:flex;align-items:center;justify-content:center}
.reward-text{font-size:2.5rem;font-weight:700;animation:rewardPop 0.8s ease forwards;text-shadow:0 2px 8px rgba(0,0,0,0.15)}
@keyframes rewardPop{0%{transform:scale(0);opacity:0}50%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:0}}
.star-particle{position:fixed;pointer-events:none;font-size:1.5rem;animation:starUp 1.2s ease forwards;z-index:9998}
@keyframes starUp{0%{transform:translateY(0) scale(0);opacity:1}50%{opacity:1}100%{transform:translateY(-200px) scale(1.5);opacity:0}}
/* toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--text);color:white;padding:8px 20px;border-radius:14px;font-size:0.82rem;z-index:999;animation:toastIn 0.3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* 音标提示 */
.en-phonetic-tip{text-align:center;font-size:1rem;color:var(--accent);font-weight:600;letter-spacing:1px;opacity:0;transform:translateY(-6px);transition:opacity 0.3s,transform 0.3s;height:0;overflow:hidden}
.en-phonetic-tip.show{opacity:1;transform:translateY(0);height:auto;margin:4px 0}
.hidden{display:none}
@media(max-width:1100px){.dashboard{grid-template-columns:1fr 1fr}}
@media(max-width:768px){.sidebar{display:none}.main-wrapper{margin-left:0}.dashboard{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">🌸</div>
    <button class="nav-item active" data-section="lang"><span class="nav-icon">📚</span>语言学习</button>

    <button class="nav-item" data-section="invest"><span class="nav-icon">📈</span>投资理财</button>

</nav>

<div class="main-wrapper">
    <header class="header">
        <div class="greeting">
            <h1 id="greetingText">🌸 下午好呀~</h1>
            <p class="date-time" id="dateTime"></p>
        </div>
        <div class="header-right">
            <div class="sleep-badge">🌙 <span id="sleepCountdown">--</span></div>
        </div>
    </header>
    <main class="dashboard" id="dashboard"></main>
</div>
<script>
// ============ STATE ============

// ============ 语言事件 ============
function bindLangEvents(){
    document.querySelectorAll('#sec-lang .tab-btn').forEach(function(tab){
        tab.addEventListener('click',function(){
            document.querySelectorAll('#sec-lang .tab-btn').forEach(function(t){t.classList.remove('active');});
            document.querySelectorAll('#sec-lang .tab-content').forEach(function(c){c.classList.remove('active');});
            tab.classList.add('active');document.getElementById(tab.dataset.lang+'Tab').classList.add('active');
        });
    });
    var MAX_EN_TIME=600;
    // 从localStorage恢复学习进度（跨天不归零）
    var enPage=parseInt(localStorage.getItem('wb_en_page'))||ENGLISH_POD_DATA.getTodayPage();
    var enDialogue=ENGLISH_POD_DATA.getDialogue(enPage);
    // 只有 dialogues 对象里真正存在该页的数据才算"有数据"（前3集）
    var hasDialogueData=!!(ENGLISH_POD_DATA.dialogues[enPage]&&ENGLISH_POD_DATA.dialogues[enPage].sentences&&ENGLISH_POD_DATA.dialogues[enPage].sentences.length>0&&ENGLISH_POD_DATA.dialogues[enPage].sentences[0].words);
    var EN_TIMER_INTERVAL=null;
    STATE.enTime=parseInt(localStorage.getItem('wb_en_time'))||0;
    STATE.enSentenceIdx=parseInt(localStorage.getItem('wb_m_en_idx'))||0;

    function updateEnTimerUI(){
        var m=Math.floor(STATE.enTime/60),s=STATE.enTime%60;
        var el=document.getElementById('enTimerCountdown');if(el)el.textContent=m+':'+String(s).padStart(2,'0');
        var pf=document.getElementById('enProgressFill');if(pf)pf.style.width=Math.min(100,(STATE.enTime/MAX_EN_TIME)*100)+'%';
        if(STATE.enTime>=MAX_EN_TIME){var tw=document.getElementById('enTimeWarning');if(tw)tw.classList.remove('hidden');if(pf)pf.classList.add('overtime');}
    }
    var MAX_EN_TIME=720; // 12分钟自动切换下一集
    function saveEnProgress(){localStorage.setItem('wb_en_time',STATE.enTime);localStorage.setItem('wb_en_page',enPage);localStorage.setItem('wb_m_en_idx',STATE.enSentenceIdx);}
    
    // 渲染跟读区域
    function renderShadowSection(){
        var el=document.getElementById('enShadowSection');
        if(hasDialogueData){
            var sents=enDialogue.sentences,sentsTotal=sents.length;
            el.innerHTML='<h4 class="en-shadow-title">🎤 逐句跟读</h4>'+
                '<div class="en-sentence-box">'+
                    '<p class="en-sentence-label">💬 第 <span id="enSentIdx">1</span>/<span id="enSentTotal">'+sentsTotal+'</span> 句</p>'+
                    '<p class="en-sentence" id="enSentence">点击下方开始跟读~</p>'+
                    '<p class="en-translation" id="enTranslation"></p>'+
                    '<p class="en-phonetic-tip" id="enPhoneticTip"></p>'+
                '</div>'+
                '<div class="word-feedback hidden" id="enWordFeedback"><h4>🔍 逐词分析</h4><div class="word-list" id="enWordList"></div></div>'+
                '<div class="btn-row">'+
                    '<button class="btn btn-prev" id="enPrevBtn">⏮</button>'+
                    '<button class="btn btn-play" id="enPlayBtn">🔊</button>'+
                    '<button class="btn btn-record" id="enRecordBtn">🎤</button>'+
                    '<button class="btn btn-next" id="enNextBtn">⏭</button>'+
                '</div>'+
                '<div class="score-bar"><div class="score-fill" id="enScoreFill" style="width:0%"></div></div>'+
                '<span class="score-text" id="enScoreText">得分: --</span>'+
                '<div class="en-auto-next hidden" id="enAutoNext"><span>⏱ 自动下一句：</span><span class="en-auto-countdown" id="enAutoCountdown">3</span><span>秒</span></div>';
        }else{
            el.innerHTML='<h4 class="en-shadow-title">🎤 自由跟读</h4>'+
                '<p style="font-size:0.7rem;color:var(--text-muted);text-align:center;margin-bottom:6px">📺 请观看上方视频，输入你听到的句子进行跟读练习</p>'+
                '<textarea id="enFreeInput" placeholder="在这里输入视频中的英文句子..." style="width:100%;min-height:40px;border-radius:8px;border:1.5px solid var(--border);padding:8px;font-family:var(--font);font-size:0.8rem;resize:vertical;margin-bottom:6px"></textarea>'+
                '<div class="en-sentence-box" style="margin-top:4px">'+
                    '<p class="en-sentence" id="enSentence">输入句子后点击 🔊 播放</p>'+
                '</div>'+
                '<div class="word-feedback hidden" id="enWordFeedback"><h4>🔍 逐词分析</h4><div class="word-list" id="enWordList"></div></div>'+
                '<div class="btn-row">'+
                    '<button class="btn btn-play" id="enPlayBtn" style="grid-column:1/3">🔊 播放句子</button>'+
                '</div>'+
                '<div class="btn-row">'+
                    '<button class="btn btn-record" id="enRecordBtn">🎤 开始跟读</button>'+
                '</div>'+
                '<div class="score-bar"><div class="score-fill" id="enScoreFill" style="width:0%"></div></div>'+
                '<span class="score-text" id="enScoreText">得分: --</span>';
        }
    }
    renderShadowSection();
    function goNextEpisode(){
        enPage++;if(enPage>ENGLISH_POD_DATA.totalPages)enPage=1;
        enDialogue=ENGLISH_POD_DATA.getDialogue(enPage);
        hasDialogueData=!!(ENGLISH_POD_DATA.dialogues[enPage]&&ENGLISH_POD_DATA.dialogues[enPage].sentences&&ENGLISH_POD_DATA.dialogues[enPage].sentences.length>0);
        STATE.enTime=0;STATE.enSentenceIdx=0;
        updateEnTimerUI();
        renderShadowSection();
        if(hasDialogueData)updateEnUI();
        saveEnProgress();
        var f=document.getElementById('enBilibiliFrame');
        f.src='https://player.bilibili.com/player.html?bvid='+ENGLISH_POD_DATA.bv+'&page='+enPage+'&autoplay=1';
        localStorage.setItem('wb_en_playtime','0');
        document.querySelector('#sec-lang .episode-tag').textContent='Day '+enPage+'·第'+enPage+'集';
        toast('📺 自动播放第 '+enPage+' 集');
        addPoints(15);showReward('📺 进入下一集！');
    }
    function startEnTimer(){if(EN_TIMER_INTERVAL)clearInterval(EN_TIMER_INTERVAL);EN_TIMER_INTERVAL=setInterval(function(){STATE.enTime++;updateEnTimerUI();if(STATE.enTime>=MAX_EN_TIME){pauseEnTimer();goNextEpisode();}if(STATE.enTime%30===0)saveEnProgress();},1000);}
    function pauseEnTimer(){if(EN_TIMER_INTERVAL){clearInterval(EN_TIMER_INTERVAL);EN_TIMER_INTERVAL=null;}saveEnProgress();}

    // 续播：跨天保留播放进度，不归零
    var enPlayStart=0;
    document.getElementById('enVideoStartBtn').addEventListener('click',function(){
        var f=document.getElementById('enBilibiliFrame'),p=document.getElementById('enVideoPlaceholder');
        // 每次点击时实时读取最新进度（跨天不归零）
        var latestPlayTime=parseInt(localStorage.getItem('wb_en_playtime')||'0');
        var src='https://player.bilibili.com/player.html?bvid='+ENGLISH_POD_DATA.bv+'&page='+enPage+'&autoplay=1';
        if(latestPlayTime>0)src+='&t='+latestPlayTime;
        f.src=src;
        f.classList.remove('hidden');p.classList.add('hidden');startEnTimer();
        var shield=document.getElementById('enVideoShield'),hint=document.getElementById('enVideoHint');
        shield.classList.add('active');shield.classList.remove('paused');
        hint.classList.add('show');
        setTimeout(function(){hint.classList.remove('show');},3000);
        enPaused=false;
        // 记录播放起始基准
        enPlayStart=Date.now()-(latestPlayTime*1000);
        if(window._enPlayInterval)clearInterval(window._enPlayInterval);

    function showEnFeedback(sentence){
        var words=sentence.words||[];
        var targetText=sentence.en.toLowerCase().replace(/[^a-z0-9\s]/g,'').trim();
        
        // 使用语音识别来做真实发音检测
        if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
            var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
            var rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;
            
            document.getElementById('enScoreFill').style.width='30%';
            document.getElementById('enScoreText').textContent='正在识别发音...';
            
            rec.onresult=function(e){
                var transcript=e.results[0][0].transcript.toLowerCase().replace(/[^a-z0-9\s]/g,'').trim();
                var spokenWords=transcript.split(/\s+/).filter(function(w){return w.length>0;});
                var targetWords=targetText.split(/\s+/);
                
                // 逐词比对：将识别结果与原文做模糊匹配
                var badSet={};var goodSet={};
                for(var i=0;i<words.length;i++){
                    var tw=words[i].w.toLowerCase().replace(/[^a-z]/g,'');
                    var matched=false;
                    for(var j=0;j<spokenWords.length;j++){
                        if(spokenWords[j] && !goodSet[j]){
                            var sw=spokenWords[j].replace(/[^a-z]/g,'');
                            var dist=levenshteinDistance(tw,sw);
                            var threshold=Math.max(1,Math.floor(tw.length*0.3));
                            if(dist<=threshold || sw===tw || sw.indexOf(tw)!==-1 || tw.indexOf(sw)!==-1){
                                matched=true;goodSet[j]=true;break;
                            }
                        }
                    }
                    if(!matched)badSet[i]=true;
                }
                
                var badCount=Object.keys(badSet).length;
                var goodCount=words.length-badCount;
                var score=words.length===0?80:Math.min(98,Math.round((goodCount/words.length)*90+8));
                
                document.getElementById('enScoreFill').style.width=score+'%';
                document.getElementById('enScoreText').textContent='句子得分: '+score+'分 ('+goodCount+'/'+words.length+' 准确)';
                
                var coloredHtml='';
                for(var i=0;i<words.length;i++){
                    var w=words[i],cls=badSet[i]?'bad':'good';
                    if(badSet[i]){
                        coloredHtml+='<span class="word-inline '+cls+'" onclick="playWord(\''+w.w.replace(/'/g,"\\'")+'\',\''+w.phonetic.replace(/'/g,"\\'")+'\')" title="发音需练习，点击听标准音">'+w.w+'</span> ';
                    }else{
                        coloredHtml+='<span class="word-inline '+cls+'" title="'+w.phonetic+' — 发音正确 ✓">'+w.w+'</span> ';
                    }
                }
                document.getElementById('enSentence').innerHTML=coloredHtml.trim();
                document.getElementById('enAutoNext').classList.add('hidden');
            };
            
            rec.onerror=function(err){
                fallbackAllGood(words);
                document.getElementById('enScoreText').textContent+=' (语音识别未启用)';
            };
            
            rec.onnomatch=function(){
                fallbackAllBad(words);
                document.getElementById('enScoreText').textContent='句子得分: 0分 (未识别到语音)';
            };
            
            rec.start();
            setTimeout(function(){try{rec.stop();}catch(e){}}, 4000);
        }else{
            fallbackAllGood(words);
            document.getElementById('enScoreText').textContent+=' (需Chrome浏览器)';
        }
    }
    
    function fallbackAllGood(words){
        var score=words.length>0?85:80;
        document.getElementById('enScoreFill').style.width=score+'%';
        document.getElementById('enScoreText').textContent='句子得分: '+score+'分 (尝试跟读)';
        var html='';
        for(var i=0;i<words.length;i++){
            var w=words[i];

        }

        document.getElementById('enAutoNext').classList.add('hidden');
    }
    
    function fallbackAllBad(words){
        document.getElementById('enScoreFill').style.width='10%';
        var html='';
        for(var i=0;i<words.length;i++){
            var w=words[i];
            html+='<span class="word-inline bad" onclick="playWord(\''+w.w.replace(/'/g,"\\'")+'\',\''+w.phonetic.replace(/'/g,"\\'")+'\')" title="点击听标准音">'+w.w+'</span> ';

    function levenshteinDistance(a,b){
        if(a.length===0)return b.length;if(b.length===0)return a.length;
        var matrix=[];
        for(var i=0;i<=b.length;i++)matrix[i]=[i];
        for(var j=0;j<=a.length;j++)matrix[0][j]=j;
        for(var i=1;i<=b.length;i++){
            for(var j=1;j<=a.length;j++){
                if(b.charAt(i-1)===a.charAt(j-1))matrix[i][j]=matrix[i-1][j-1];
                else matrix[i][j]=Math.min(matrix[i-1][j-1]+1,Math.min(matrix[i][j-1]+1,matrix[i-1][j]+1));
            }
        }
        return matrix[b.length][a.length];
    }

// ============ 支出事件 ============
function bindExpenseEvents(){
    document.getElementById('importBtn').addEventListener('click',function(){document.getElementById('expFile').click();});
    document.getElementById('expFile').addEventListener('change',function(e){if(e.target.files[0])parseCSV(e.target.files[0]);});
    if(!STATE.expenses.length)genDemo();updateExp();
}
function genDemo(){STATE.expenses=[];var n=new Date(),m=n.getMonth(),cats=['餐饮','交通','购物','娱乐','生活缴费','其他'];for(var i=0;i<45;i++){STATE.expenses.push({date:new Date(n.getFullYear(),m,Math.floor(Math.random()*28)+1),category:cats[Math.floor(Math.random()*5)],amount:Math.round((Math.random()*300+5)*100)/100});}STATE.expenses.sort(function(a,b){return b.date-a.date;});}
function parseCSV(file){var r=new FileReader();r.onload=function(e){var lines=e.target.result.split('\n').filter(function(l){return l.trim();}),ne=[];for(var i=1;i<lines.length;i++){var cols=lines[i].split(',');if(cols.length<2)continue;var amt=0,desc='';cols.forEach(function(c){var n=parseFloat(c.replace(/[^0-9.]/g,''));if(!isNaN(n)&&n>0)amt=n;else if(c.trim())desc=c.trim();});if(amt>0)ne.push({date:new Date(),category:classify(desc),amount:amt});}if(ne.length){STATE.expenses=ne.concat(STATE.expenses);updateExp();saveStorage();toast('✅ 导入 '+ne.length+' 条');}};r.readAsText(file);}
function classify(d){var rules=[{c:'餐饮',k:['餐饮','外卖','奶茶','咖啡','食堂','零食','美团','饿了么','饭','面','KFC','麦当劳','瑞幸']},{c:'交通',k:['交通','地铁','公交','打车','滴滴','加油','高铁','机票']},{c:'购物',k:['购物','淘宝','京东','拼多多','衣服','鞋','化妆品','日用品','超市','天猫']},{c:'娱乐',k:['娱乐','电影','游戏','KTV','旅游','门票','会员','steam']},{c:'生活缴费',k:['电费','水费','燃气','话费','网费','房租','物业']}];for(var i=0;i<rules.length;i++)for(var j=0;j<rules[i].k.length;j++)if(d.indexOf(rules[i].k[j])>=0)return rules[i].c;return '其他';}
function updateExp(){var n=new Date();document.getElementById('curMonth').textContent=(n.getMonth()+1)+'月';var cats=['餐饮','交通','购物','娱乐','生活缴费','其他'],totals={};cats.forEach(function(c){totals[c]=0;});STATE.expenses.forEach(function(e){if(totals[e.category]!==undefined)totals[e.category]+=e.amount;});var total=0;cats.forEach(function(c){total+=totals[c];});document.getElementById('totalExp').textContent='¥ '+total.toFixed(0);var maxC=Math.max.apply(null,cats.map(function(c){return totals[c];}))||1;var catEls=document.querySelectorAll('#expCats .cat-item');cats.forEach(function(c,i){var amt=totals[c];catEls[i].querySelector('.cat-amount').textContent='¥ '+amt.toFixed(0);catEls[i].querySelector('.cat-fill').style.width=(amt/maxC*100)+'%';});}

// ============ 灵感事件 ============
function bindInspoEvents(){
    document.querySelectorAll('#sec-inspo .tab-btn').forEach(function(tab){
        tab.addEventListener('click',function(){
            document.querySelectorAll('#sec-inspo .tab-btn').forEach(function(t){t.classList.remove('active');});
            document.querySelectorAll('#sec-inspo .tab-content').forEach(function(c){c.classList.remove('active');});
            tab.classList.add('active');document.getElementById(tab.dataset.inspo+'InspoTab').classList.add('active');
        });
    });
    document.getElementById('xhsList').innerHTML=XHS_POSTS.map(function(p){return '<div class="post-item" onclick="window.open(\'https://www.xiaohongshu.com/explore\',\'_blank\')"><span class="post-rank">'+p.r+'</span><div><div class="post-title">'+p.t+'</div><div class="post-meta">'+p.m+'</div></div></div>';}).join('');
    document.getElementById('dyList').innerHTML=DY_POSTS.map(function(p){return '<div class="post-item" onclick="window.open(\'https://www.douyin.com\',\'_blank\')"><span class="post-rank">'+p.r+'</span><div><div class="post-title">'+p.t+'</div><div class="post-meta">'+p.m+'</div></div></div>';}).join('');
}

// ============ 搞钱事件 ============
function bindMoneyEvents(){
    var tips=getDailyMoneyTips(),platforms={'小红书':'https://www.xiaohongshu.com/explore','抖音':'https://www.douyin.com','B站':'https://www.bilibili.com','知乎':'https://www.zhihu.com'};

// ============ 投资事件 ============
function initInvest(){
    document.querySelectorAll('#sec-invest .tab-btn').forEach(function(tab){
        tab.addEventListener('click',function(){
            document.querySelectorAll('#sec-invest .tab-btn').forEach(function(t){t.classList.remove('active');});
            document.querySelectorAll('#sec-invest .tab-content').forEach(function(c){c.classList.remove('active');});
            tab.classList.add('active');document.getElementById('invest'+(tab.dataset.invest.charAt(0).toUpperCase()+tab.dataset.invest.slice(1))+'Tab').classList.add('active');
        });
    });
    fetch('https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=1.000001,0.399001,0.399006&fields=f2,f3,f4,f12,f14').then(function(r){return r.json();}).then(function(d){
        if(d.data&&d.data.diff){d.data.diff.forEach(function(dd,i){var pe=document.getElementById(['shPrice','szPrice','cyPrice'][i]),ce=document.getElementById(['shChange','szChange','cyChange'][i]);if(pe)pe.textContent=dd.f2?dd.f2.toFixed(2):'--';if(ce){var pct=dd.f3?dd.f3.toFixed(2):'0.00';ce.textContent=(dd.f3>=0?'+':'')+pct+'%';ce.className='index-change '+(dd.f3>=0?'up':'down');}});}document.getElementById('marketDate').textContent=(new Date().getMonth()+1)+'/'+new Date().getDate();}).catch(function(){document.getElementById('shPrice').textContent='3256.78';document.getElementById('shChange').textContent='+0.32%';document.getElementById('shChange').className='index-change up';document.getElementById('szPrice').textContent='10892.45';document.getElementById('szChange').textContent='-0.18%';document.getElementById('szChange').className='index-change down';document.getElementById('cyPrice').textContent='2156.32';document.getElementById('cyChange').textContent='+0.56%';document.getElementById('cyChange').className='index-change up';});
    // 热门板块（带真实板块代码）
    var sectors=[{n:'半导体',code:'BK1036',c:2.35},{n:'AI算力',code:'BK1139',c:1.82},{n:'新能源',code:'BK0493',c:-0.56},{n:'医药',code:'BK0465',c:-1.23},{n:'消费电子',code:'BK1037',c:3.15},{n:'军工',code:'BK0490',c:0.78}];
    var sectorHtml='';
    sectors.forEach(function(s,i){
        sectorHtml+='<span class="sector-item '+(s.c>=0?'up':'down')+'" data-idx="'+i+'" data-code="'+s.code+'" data-name="'+s.n+'">'+(s.c>=0?'🔥':'📉')+' '+s.n+' '+(s.c>=0?'+':'')+s.c+'%</span>';
    });
    document.getElementById('sectorList').innerHTML=sectorHtml;
    
    // 点击板块获取股票排行
    var currentSector=null;
    // Fallback: 内置板块龙头数据（API不通时使用）
    var FALLBACK_STOCKS={
        '半导体':[{n:'中芯国际',p:'48.52',c:'+2.35'},{n:'北方华创',p:'312.80',c:'+1.82'},{n:'韦尔股份',p:'98.36',c:'+3.15'},{n:'中微公司',p:'145.60',c:'-0.56'},{n:'兆易创新',p:'82.15',c:'+1.23'}],
        'AI算力':[{n:'中科曙光',p:'52.30',c:'+3.21'},{n:'浪潮信息',p:'38.65',c:'+2.15'},{n:'寒武纪',p:'215.40',c:'+5.68'},{n:'海光信息',p:'68.90',c:'+1.45'},{n:'工业富联',p:'22.18',c:'-0.32'}],
        '新能源':[{n:'宁德时代',p:'205.30',c:'-0.56'},{n:'比亚迪',p:'268.50',c:'+1.20'},{n:'隆基绿能',p:'18.65',c:'-1.23'},{n:'阳光电源',p:'82.40',c:'+0.85'},{n:'通威股份',p:'22.15',c:'-2.10'}],
        '医药':[{n:'药明康德',p:'52.30',c:'-1.23'},{n:'恒瑞医药',p:'45.80',c:'+0.56'},{n:'迈瑞医疗',p:'285.60',c:'+1.15'},{n:'片仔癀',p:'238.50',c:'-0.32'},{n:'爱尔眼科',p:'15.20',c:'-2.15'}],
        '消费电子':[{n:'立讯精密',p:'32.50',c:'+3.15'},{n:'歌尔股份',p:'22.80',c:'+2.56'},{n:'蓝思科技',p:'18.35',c:'+1.80'},{n:'传音控股',p:'135.60',c:'+4.20'},{n:'鹏鼎控股',p:'28.90',c:'+2.35'}],
        '军工':[{n:'中航沈飞',p:'42.30',c:'+0.78'},{n:'航发动力',p:'38.50',c:'+1.25'},{n:'中国卫星',p:'28.60',c:'-0.45'},{n:'中航光电',p:'35.20',c:'+0.92'},{n:'航天电器',p:'52.80',c:'+1.56'}]
    };
    function showFallbackStocks(name,el){
        var stocks=FALLBACK_STOCKS[name]||[];
        if(!stocks.length){el.innerHTML='<div class="stock-loading">暂无数据</div>';return;}
        var html='<h4>📊 '+name+' Top5 <span style="font-size:0.6rem;color:var(--text-muted)">（缓存数据）</span></h4>';
        stocks.forEach(function(st){
            var up=st.c.charAt(0)!=='-';
            html+='<div class="stock-row"><span class="stock-name">'+st.n+'</span><span class="stock-price">¥'+st.p+'</span><span class="stock-change '+(up?'up':'down')+'">'+st.c+'%</span></div>';
        });
        el.innerHTML=html;
    }
    document.querySelectorAll('#sec-invest .sector-item').forEach(function(item){
        item.addEventListener('click',function(){
            var idx=parseInt(this.dataset.idx);
            // Toggle active
            document.querySelectorAll('#sec-invest .sector-item').forEach(function(s){s.classList.remove('active');});
            if(currentSector===idx){
                currentSector=null;
                document.getElementById('sectorStocks').classList.remove('show');
                return;
            }
            this.classList.add('active');
            currentSector=idx;
            var code=this.dataset.code,name=this.dataset.name;
            var stocksEl=document.getElementById('sectorStocks');
            stocksEl.classList.add('show');
            stocksEl.innerHTML='<div class="stock-loading">⏳ 加载 '+name+' Top5...</div>';
            
            // 东方财富板块股票排行API（如网络不通则用缓存数据）
            fetch('https://push2.eastmoney.com/api/qt/clist/get?fid=f3&po=1&pz=5&pn=1&np=1&fltt=2&invt=2&fs=b:'+code+'&fields=f2,f3,f12,f14')
                .then(function(r){return r.json();})
                .then(function(d){
                    if(d.data&&d.data.diff&&d.data.diff.length){
                        var html='<h4>📊 '+name+' Top5</h4>';
                        d.data.diff.forEach(function(st){
                            var price=st.f2?st.f2.toFixed(2):'--';
                            var pct=st.f3?st.f3.toFixed(2):'0.00';
                            var up=st.f3>=0;
                            html+='<div class="stock-row"><span class="stock-name">'+st.f14+'</span><span class="stock-price">¥'+price+'</span><span class="stock-change '+(up?'up':'down')+'">'+(up?'+':'')+pct+'%</span></div>';
                        });
                        stocksEl.innerHTML=html;
                    }else{showFallbackStocks(name,stocksEl);}
                }).catch(function(){showFallbackStocks(name,stocksEl);});
        });
    });
    fetch('https://api.gold-api.com/price/XAU',{headers:{'Accept':'application/json'}}).then(function(r){return r.json();}).then(function(d){if(d&&d.price){var sge=(d.price*7.25/31.1035+2).toFixed(2);document.getElementById('sgeGold').textContent='¥ '+sge;document.getElementById('intlGold').textContent='$ '+d.price.toFixed(2);document.getElementById('chowGold').textContent='¥ '+(parseFloat(sge)+50).toFixed(0);}}).catch(function(){document.getElementById('sgeGold').textContent='¥ 558.65';document.getElementById('intlGold').textContent='$ 2,385.50';document.getElementById('chowGold').textContent='¥ 608';});
}

// ============ 奖励系统 ============
function addPoints(pts){STATE.totalPoints+=pts;localStorage.setItem('wb_points',STATE.totalPoints);document.getElementById('totalPoints').textContent=STATE.totalPoints;}
function showReward(msg){
    var emojis=['⭐','🌟','✨','💫','🎉','🎊','💖','🔥'];
    for(var i=0;i<12;i++){var star=document.createElement('div');star.className='star-particle';star.textContent=emojis[Math.floor(Math.random()*emojis.length)];star.style.left=Math.random()*80+10+'%';star.style.top=Math.random()*60+20+'%';star.style.animationDelay=Math.random()*0.5+'s';star.style.animationDuration=(1+Math.random()*1.2)+'s';document.body.appendChild(star);setTimeout(function(s){return function(){s.remove();};}(star),1500);}
    var overlay=document.createElement('div');overlay.className='reward-overlay';var text=document.createElement('div');text.className='reward-text';text.textContent=msg;overlay.appendChild(text);document.body.appendChild(overlay);setTimeout(function(){overlay.remove();},900);
    document.getElementById('totalPoints').textContent=STATE.totalPoints;
}

// ============ Toast ============
function toast(msg){var old=document.querySelector('.toast');if(old)old.remove();var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2500);}

// ============ 存储 ============
function saveStorage(){localStorage.setItem('wb_m_notes',JSON.stringify(STATE.readingNotes));localStorage.setItem('wb_m_expenses',JSON.stringify(STATE.expenses));localStorage.setItem('wb_m_en_idx',STATE.enSentenceIdx);localStorage.setItem('wb_m_rd_sec',STATE.readingSeconds);localStorage.setItem('wb_points',STATE.totalPoints);}
function loadStorage(){try{var n=localStorage.getItem('wb_m_notes');if(n)STATE.readingNotes=JSON.parse(n);var e=localStorage.getItem('wb_m_expenses');if(e)STATE.expenses=JSON.parse(e);STATE.enSentenceIdx=parseInt(localStorage.getItem('wb_m_en_idx')||'0');STATE.readingSeconds=parseInt(localStorage.getItem('wb_m_rd_sec')||'0');STATE.totalPoints=parseInt(localStorage.getItem('wb_points')||'0');document.getElementById('totalPoints').textContent=STATE.totalPoints;if(window.updateRdTime)updateRdTime();if(window.renderNotes)renderNotes();updateExp();}catch(ex){}}
window.addEventListener('beforeunload',function(){saveStorage();if(STATE.yogaTimer)clearInterval(STATE.yogaTimer);if(STATE.hiitTimer)clearInterval(STATE.hiitTimer);if(STATE.readingTimer)clearInterval(STATE.readingTimer);if(STATE.koTimer)clearInterval(STATE.koTimer);if(window._enPlayInterval)clearInterval(window._enPlayInterval);});
</script>
